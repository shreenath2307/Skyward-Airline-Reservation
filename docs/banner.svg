<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Skyward - Airline Seat Reservation System">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a5b"/>
      <stop offset="0.55" stop-color="#2f6fc4"/>
      <stop offset="1" stop-color="#9cc9f5"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.85"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="70" ry="20"/>
      <ellipse cx="-35" cy="-12" rx="35" ry="22"/>
      <ellipse cx="22" cy="-18" rx="40" ry="26"/>
    </g>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="90"  cy="40"  r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="70"  r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="30"  r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="55"  r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="35" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="85" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- drifting clouds (far / near) -->
    <g fill="#fff" opacity="0.35">
      <use href="#cloud" y="230"><animateTransform attributeName="transform" type="translate" from="-150 0" to="1350 0" dur="48s" repeatCount="indefinite"/></use>
      <use href="#cloud" y="120"><animateTransform attributeName="transform" type="translate" from="400 0" to="1550 0" dur="60s" repeatCount="indefinite"/></use>
    </g>
    <g fill="#fff" opacity="0.6">
      <use href="#cloud" y="285" transform="scale(1.4)"><animateTransform attributeName="transform" type="translate" additive="sum" from="-200 0" to="1100 0" dur="26s" repeatCount="indefinite"/></use>
      <use href="#cloud" y="190"><animateTransform attributeName="transform" type="translate" from="900 0" to="-250 0" dur="36s" repeatCount="indefinite"/></use>
    </g>

    <!-- dashed flight path -->
    <path d="M -20 250 C 250 250 330 90 620 120 S 1000 60 1220 40" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 10" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- plane flying along the path -->
    <g>
      <g transform="translate(-95 0)">
        <rect x="0" y="-2" width="90" height="4" rx="2" fill="url(#trail)"/>
      </g>
      <g fill="#fff">
        <path d="M 0 0 L -14 -3 L -10 0 L -14 3 Z" transform="translate(-4 0)"/>
        <path d="M 22 0 C 14 -5 -6 -5 -16 -2 L -22 -12 L -27 -12 L -22 0 L -27 12 L -22 12 L -16 2 C -6 5 14 5 22 0 Z" transform="scale(1.1)"/>
        <path d="M 4 -3 L -8 -26 L -1 -26 L 14 -3 Z"/>
        <path d="M 4 3 L -8 26 L -1 26 L 14 3 Z"/>
      </g>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M -20 250 C 250 250 330 90 620 120 S 1000 60 1220 40"/>
    </g>

    <!-- title -->
    <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff">
      <text x="600" y="150" font-size="76" font-weight="700" letter-spacing="14">
        SKYWARD
        <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
      </text>
      <text x="600" y="190" font-size="21" letter-spacing="5" opacity="0.92">
        AIRLINE SEAT RESERVATION SYSTEM
        <animate attributeName="opacity" from="0" to="0.92" begin="0.6s" dur="1.4s" fill="freeze"/>
      </text>
      <text x="600" y="228" font-size="15" letter-spacing="2" opacity="0.8">
        Node.js  ·  Express  ·  MySQL 8  ·  Vanilla JS  ·  Shneiderman's 8 Golden Rules
        <animate attributeName="opacity" from="0" to="0.8" begin="1.2s" dur="1.4s" fill="freeze"/>
      </text>
    </g>
  </g>
</svg>
